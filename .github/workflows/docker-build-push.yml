name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily. Dependabot tracks the Dockerfiles, but the VS Code and Claude
    # Desktop versions and Fedora's in-place CVE rebuilds of the base tag
    # are all invisible to it, so between commits nothing else would ever
    # trigger a rebuild.
    # 06:17 rather than 06:00 because on-the-hour crons sit in the most
    # contended slot of GitHub's scheduler and get delayed the longest.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing upstream has moved"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; a run that may be halfway
  # through publishing :main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Labels are per image, keyed <image>_<label>, so the build step can look
    # its own up. An image without a probe gets none.
    outputs:
      images: ${{ steps.collect.outputs.images }}
      code_upstream_version: ${{ steps.upstream.outputs.upstream_version }}
      code_base_digest: ${{ steps.upstream.outputs.base_digest }}
      claude-desktop_upstream_version: ${{ steps.upstream_claude_desktop.outputs.upstream_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # paths-filter needs a before/after pair to diff against. Scheduled
      # runs have neither: it would quietly report no changes and silently
      # disable the nightly, so it only runs on events that carry a diff.
      - name: Check for changed paths
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'build/code/**'
              - 'build/entrypoint.sh'
              - 'build/setup-penguin.sh'
            claude:
              - 'build/claude/**'
              - 'build/entrypoint.sh'
              - 'build/setup-penguin.sh'
              - 'build/install-npm-global-from-package-json.sh'
            claude-desktop:
              - 'build/claude-desktop/**'
              - 'build/entrypoint.sh'
              - 'build/setup-penguin.sh'

      # Runs on every event except pull requests. On a schedule it decides
      # whether to build at all; on a push it supplies the labels that the
      # next schedule compares against. Skipping the push case would
      # publish an unlabelled image on every commit, and the next nightly
      # would read that as "unknown version" and rebuild for nothing.
      #
      # The probe needs dnf, hence the Fedora container. It matches the
      # Dockerfile's base only by coincidence — the script reads the real
      # FROM line out of the mounted checkout.
      - name: Probe upstream versions
        id: upstream
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/code
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src:ro" \
            -e IMAGE -e GHCR_USER -e GHCR_TOKEN -e FORCE \
            fedora:43 /src/.github/scripts/check-upstream-code.sh \
            | tee -a "$GITHUB_OUTPUT"

      # Same idea for claude-desktop, whose app comes from Anthropic's apt
      # repo. No container: curl, jq and skopeo are already on the runner.
      - name: Probe upstream Claude Desktop version
        id: upstream_claude_desktop
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/claude-desktop
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          .github/scripts/check-upstream-claude-desktop.sh | tee -a "$GITHUB_OUTPUT"

      - name: Collect build matrix
        id: collect
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          CODE_STALE: ${{ steps.upstream.outputs.stale }}
          CODE_REASON: ${{ steps.upstream.outputs.reason }}
          CLAUDE_DESKTOP_STALE: ${{ steps.upstream_claude_desktop.outputs.stale }}
          CLAUDE_DESKTOP_REASON: ${{ steps.upstream_claude_desktop.outputs.reason }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            push | pull_request)
              images="$CHANGED"
              ;;
            *)
              # Only images with a probe step get scheduled rebuilds. A new
              # one needs its own probe step and job outputs above.
              stale=()
              if [ "$CODE_STALE" = "yes" ]; then stale+=(code); fi
              if [ "$CLAUDE_DESKTOP_STALE" = "yes" ]; then stale+=(claude-desktop); fi
              images=$(jq -cn '$ARGS.positional' --args "${stale[@]}")
              echo "code: $CODE_REASON"
              echo "claude-desktop: $CLAUDE_DESKTOP_REASON"
              ;;
          esac
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Matrix: $images"

  build-and-push:
    needs: detect
    if: ${{ needs.detect.outputs.images != '[]' && needs.detect.outputs.images != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # One tool failing shouldn't cancel the rest of a nightly sweep.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect.outputs.images) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./build
          file: ./build/${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # dp.* is what the next scheduled run reads back to decide
          # whether anything moved.
          labels: |
            ${{ steps.meta.outputs.labels }}
            dp.upstream.version=${{ needs.detect.outputs[format('{0}_upstream_version', matrix.image)] }}
            dp.base.digest=${{ needs.detect.outputs[format('{0}_base_digest', matrix.image)] }}
          no-cache: true
          platforms: linux/amd64
          # Buildx would otherwise push an image index, and `skopeo inspect`
          # on an index returns no Labels at all — the staleness check would
          # read every published image as unlabelled and rebuild daily.
          provenance: false
